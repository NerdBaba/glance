# Adapted from adi1090x/polybar-themes; GPL-3.0.
# Source: bitmap/grayblocks/config.ini
theme = "system"
preset = "flat-dark"
use-pywal = true

[appearance]
roundness = 0.0
border-width = 0.0
border-opacity = 1
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
glow-opacity = 0
bar-font-name = "GlanceTerminus14-Regular"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "GlanceTerminus14-Regular"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#272727"
foreground-color = "#CACACA"
accent-color = "#e53935"

[experimental]

[experimental.foreground]
formation = "full"
position = "bottom"
height = 40.0
top-margin = 0
reference-width = 1920
scale-content = false
margin = 0
floating-width = 0
horizontal-alignment = "left"
horizontal-padding = 0.0
spacing = 0.0
gap = 0

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.adi_launcher", "script.adi_workspaces", "script.adi_sep", "script.adi_cpu", "script.adi_sep", "script.adi_memory", "spacer", "script.adi_updates", "script.adi_sep", "script.adi_alsa", "script.adi_mpd", "script.adi_sep", "script.adi_backlight", "spacer", "script.adi_color_switch", "script.adi_sep", "script.adi_network", "script.adi_sep", "script.adi_date", "script.adi_sysmenu"]

[widgets.pywal]
foreground-index = 15
accent-index = 4
border1-index = 8
border2-index = 8
background-index = 0

[widgets.script.adi_launcher]
content-background = "pywal:0"
content-foreground = "pywal:7"
content-padding = 4
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "launcher"
format = "<label>"
label = ""
label-background = "pywal:0"
label-foreground = "pywal:7"
label-padding = 4

[widgets.script.adi_workspaces]
icon-0 = "1;"
icon-1 = "2;"
icon-2 = "3;"
icon-3 = "4;"
icon-4 = "5;"
icon-default = ""
format = "<label-state>"
format-background = "pywal:8"
format-foreground = "pywal:15"
format-overline = "pywal:0"
format-underline = "pywal:0"
format-padding = 1
label-monitor = "%name%"
label-active = "%icon%"
label-active-foreground = "pywal:4"
label-occupied = "%icon%"
label-occupied-foreground = "pywal:3"
label-urgent = "%icon%"
label-urgent-foreground = "pywal:1"
label-empty = "%icon%"
label-active-padding = 1
label-urgent-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "workspaces"
native-decoration = false
native-action = ""

[widgets.script.adi_sep]
content-background = "pywal:0"
content-foreground = "pywal:0"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = "|"
label-background = "pywal:0"
label-foreground = "pywal:0"

[widgets.script.adi_cpu]
format = "<label-prefix><label>"
format-background = "pywal:8"
format-foreground = "pywal:15"
format-overline = "pywal:0"
format-underline = "pywal:0"
format-padding = 2
label = " %percentage%%"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "cpu"
native-decoration = false
native-action = ""
label-prefix = ""

[widgets.script.adi_memory]
format = "<label-prefix><label>"
format-background = "pywal:8"
format-foreground = "pywal:15"
format-overline = "pywal:0"
format-underline = "pywal:0"
format-padding = 2
label = " %mb_used%"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "memory"
native-decoration = false
native-action = ""
label-prefix = ""

[widgets.script.adi_updates]
format = "<label-prefix><label>"
format-background = "pywal:8"
format-foreground = "pywal:15"
format-overline = "pywal:0"
format-underline = "pywal:0"
format-padding = 2
label = "Updates"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "updates"
label-prefix = " "

[widgets.script.adi_alsa]
format-volume = "<ramp-volume> <label-volume>"
format-volume-background = "pywal:8"
format-volume-foreground = "pywal:15"
format-volume-overline = "pywal:0"
format-volume-underline = "pywal:0"
format-volume-padding = 2
format-muted = "<label-muted-prefix><label-muted>"
format-muted-background = "pywal:8"
format-muted-foreground = "pywal:15"
format-muted-overline = "pywal:0"
format-muted-underline = "pywal:0"
format-muted-padding = 2
label-volume = "%percentage%%"
label-muted = " Muted"
label-muted-foreground = "pywal:1"
ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
ramp-volume-3 = ""
ramp-volume-4 = ""
ramp-headphones-0 = ""
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "volume"
native-decoration = false
native-action = ""
label-muted-prefix = ""

[widgets.script.adi_mpd]
format-online = "<label-online-prefix><label-song> <label-prev> <label-toggle> <label-next>"
format-online-padding = 2
format-online-foreground = "pywal:7"
format-offline = "<label-offline-prefix><label-offline>"
format-offline-padding = 2
format-offline-foreground = "pywal:7"
label-song = " %artist% - %title%"
label-song-maxlen = 25
label-song-ellipsis = true
label-time = "%elapsed% / %total%"
label-offline = " Offline"
icon-play = ""
icon-pause = ""
icon-stop = ""
icon-next = ""
icon-prev = ""
icon-seekf = ""
icon-seekb = ""
icon-random = ""
icon-repeat = ""
icon-repeatone = ""
icon-single = ""
icon-consume = ""
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "music"
native-decoration = false
native-action = ""
label-prev = "%{A1:previous:}%{A}"
label-next = "%{A1:next:}%{A}"
label-stop = "%{A1:stop:}%{A}"
label-play = "%{A1:toggle:}%{A}"
label-pause = "%{A1:toggle:}%{A}"
label-toggle = "%{A1:toggle:}<label-toggle>%{A}"
label-repeat = "%{A1:toggle:}%{A}"
label-random = "%{A1:toggle:}%{A}"
label-single = "%{A1:toggle:}%{A}"
label-consume = "%{A1:toggle:}%{A}"
label-online-prefix = ""
label-offline-prefix = ""

[widgets.script.adi_backlight]
format = "<ramp> <label>"
format-background = "pywal:8"
format-foreground = "pywal:15"
format-overline = "pywal:0"
format-underline = "pywal:0"
format-padding = 2
label = "%percentage%%"
ramp-0 = ""
ramp-1 = ""
ramp-2 = ""
ramp-3 = ""
ramp-4 = ""
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "brightness"
native-decoration = false
native-action = ""

[widgets.script.adi_color_switch]
content-background = "pywal:8"
content-foreground = "pywal:15"
content-overline = "pywal:0"
content-underline = "pywal:0"
content-padding = 2
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "shuffle-colors"
format = "<label>"
label = ""
label-background = "pywal:8"
label-foreground = "pywal:15"
label-overline = "pywal:0"
label-underline = "pywal:0"
label-padding = 2

[widgets.script.adi_network]
format-connected = "<ramp-signal> <label-connected>"
format-connected-background = "pywal:8"
format-connected-foreground = "pywal:15"
format-connected-overline = "pywal:0"
format-connected-underline = "pywal:0"
format-connected-padding = 2
format-disconnected = "<label-disconnected-prefix><label-disconnected>"
format-disconnected-background = "pywal:8"
format-disconnected-foreground = "pywal:15"
format-disconnected-overline = "pywal:0"
format-disconnected-underline = "pywal:0"
format-disconnected-padding = 2
label-connected = "%{A1:network:}%essid%%{A}"
label-disconnected = "%{A1:network:} Offline%{A}"
ramp-signal-0 = ""
ramp-signal-1 = ""
ramp-signal-2 = ""
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "network"
native-decoration = false
native-action = ""
label-disconnected-prefix = ""

[widgets.script.adi_date]
format = "<label>"
format-background = "pywal:8"
format-foreground = "pywal:15"
format-overline = "pywal:0"
format-underline = "pywal:0"
format-padding = 2
label = "%time%"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "date"
native-decoration = false
native-action = ""
date-pattern = ""
time-pattern = " hh:mm a"
seconds = false

[widgets.script.adi_sysmenu]
content-background = "pywal:0"
content-foreground = "pywal:7"
content-padding = 4
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "power"
format = "<label>"
label = ""
label-background = "pywal:0"
label-foreground = "pywal:7"
label-padding = 4
