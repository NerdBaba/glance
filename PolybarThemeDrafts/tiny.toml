# Randomazzo preset inspired by kiddae/polybar-themes/tiny.
# Bundled and imported without overwriting existing presets.
theme = "system"
preset = "flat-dark"
use-pywal = true

[appearance]
roundness = 50
border-width = 0
border-opacity = 0.45
fill-opacity = 1
shadow-opacity = 0.0
shadow-radius = 0.0
bar-font-name = "SatoshiVariable-Bold"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "SatoshiVariable-Bold"
widget-font-size = 14
widget-font-weight = 3

[experimental.foreground]
scale-content = false
formation = "floating"
position = "top"
height = 34
top-margin = 6
margin = 12
horizontal-padding = 12
spacing = 9
gap = 8

floating-width = 300
horizontal-alignment = "right"
[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["default.spaces", "spacer", "default.volume", "default.time"]
[widgets.default.spaces.space]
display-mode = "focused-number"
highlight = "pill"
icon-style = "sf-symbols"
tint-icons = true
show-key = false
numeral-system = "arabic"

[widgets.default.nowplaying]
show-icon = true
show-title = false
show-artist = false
show-album = false
show-visualizer = false
title-max-length = 28
artist-max-length = 18

[widgets.default.time]
format = "EEE · HH:mm"
calendar.format = "H:mm"
calendar.show-events = false

[widgets.default.volume]
display-mode = "icon-value"
show-percentage = true

[widgets.default.systemmonitor]
cpu-display-mode = "icon-value"
mem-display-mode = "icon-value"

[widgets.default.launcher]
display-mode = "icon"
label = "Apps"
symbol = "square.grid.2x2"

[widgets.default.power]
display-mode = "icon"
label = "Power"
symbol = "power"

[widgets.widget-colors]
mode = "disabled"
"default.spaces" = 8
"default.activeapp" = 9
"default.nowplaying" = 10
"default.weather" = 11
"default.time" = 12
"default.energy" = 13
"default.fan" = 14
"default.temperature" = 15
"default.systemmonitor" = 8
"default.network" = 9
"default.volume" = 10
"default.power" = 11
"default.launcher" = 12


"default.mediacontrols" = 10
[widgets.default.mediacontrols]
show-previous = false
show-play-pause = true
show-next = false

[widgets.pywal]

foreground-index = 15
accent-index = 4
background-index = 0
border1-index = 4
border2-index = 4

