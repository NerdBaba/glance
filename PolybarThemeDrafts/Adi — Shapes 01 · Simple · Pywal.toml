label-background = "pywal:7"
label-foreground = "pywal:15"
label-padding = 1

[widgets.script.adi_right6]
content-background = "pywal:7"
content-foreground = "pywal:6"
content-font = 2
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = ""
label-background = "pywal:7"
label-foreground = "pywal:6"
label-font = 2

[widgets.script.adi_alsa]
format-volume = "<ramp-volume> <label-volume>"
format-volume-background = "pywal:5"
format-volume-padding = 1
format-muted = "<label-muted-prefix><label-muted>"
format-muted-background = "pywal:5"
format-muted-padding = 1
label-volume = "%percentage%% "
label-muted = " Muted "
label-muted-foreground = "pywal:15"
ramp-volume-0 = "奄"
ramp-volume-1 = "奔"
ramp-volume-2 = "墳"
ramp-headphones-0 = ""
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "volume"
native-decoration = false
native-action = ""
label-muted-prefix = "婢"

[widgets.script.adi_right3]
content-background = "pywal:5"
content-foreground = "pywal:3"
content-font = 2
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
