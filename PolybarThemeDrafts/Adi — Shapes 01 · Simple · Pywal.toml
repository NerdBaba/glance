# Adapted from adi1090x/polybar-themes; GPL-3.0.
# Source: simple/shapes/config.ini
theme = "system"
preset = "flat-dark"
use-pywal = true

[appearance]
roundness = 0.0
border-width = 0.0
border-opacity = 1
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
glow-opacity = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#1F1F1F"
foreground-color = "#FFFFFF"
accent-color = "#202020"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 32.0
top-margin = 0
reference-width = 1920
scale-content = false
margin = 0
floating-width = 0
horizontal-alignment = "left"
horizontal-padding = 0.0
spacing = 0.0
gap = 0

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.adi_color_switch", "script.adi_palette_edge", "script.adi_launcher", "script.adi_left1", "script.adi_title", "script.adi_left2", "spacer", "script.adi_workspaces", "script.adi_sep", "script.adi_mpd", "spacer", "script.adi_right7", "script.adi_alsa", "script.adi_right3", "script.adi_network", "script.adi_right2", "script.adi_date", "script.adi_right1", "script.adi_sysmenu"]

[widgets.pywal]
foreground-index = 15
accent-index = 4
border1-index = 8
border2-index = 8
background-index = 0

[widgets.script.adi_launcher]
content-background = "pywal:1"
content-foreground = "pywal:15"
content-padding = 1
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = false
native-action = "launcher"
format = "<label>"
label = " "
label-background = "pywal:1"
label-foreground = "pywal:15"
label-padding = 1

[widgets.script.adi_left1]
content-background = "pywal:2"
content-foreground = "pywal:1"
content-font = 2
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = ""
label-background = "pywal:2"
label-foreground = "pywal:1"
label-font = 2

[widgets.script.adi_title]
format = "<label>"
format-background = "pywal:2"
format-padding = 1
label = " %title%"
label-maxlen = 30
label-empty = " Desktop"
label-empty-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "window"
native-decoration = false
native-action = ""

[widgets.script.adi_left2]
content-background = "pywal:0"
content-foreground = "pywal:2"
content-font = 2
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = ""
label-background = "pywal:0"
label-foreground = "pywal:2"
label-font = 2

[widgets.script.adi_workspaces]
icon-0 = "1;"
icon-1 = "2;"
icon-2 = "3;"
icon-3 = "4;"
icon-4 = "5;"
icon-default = ""
format = "<label-state>"
label-monitor = "%name%"
label-active = ""
label-active-foreground = "pywal:7"
label-occupied = ""
label-occupied-foreground = "pywal:7"
label-urgent = ""
label-urgent-foreground = "pywal:2"
label-empty = ""
label-empty-foreground = "pywal:7"
label-active-padding = 1
label-urgent-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "workspaces"
native-decoration = false
native-action = ""

[widgets.script.adi_sep]
content-background = "pywal:0"
content-foreground = "pywal:1"
content-padding = 0
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = " | "
label-background = "pywal:0"
label-foreground = "pywal:1"
label-padding = 0

[widgets.script.adi_mpd]
format-online = "<label-online-prefix><label-song> <label-prev> <label-toggle> <label-next>"
format-online-foreground = "pywal:7"
format-offline = "<label-offline-prefix><label-offline>"
format-offline-foreground = "pywal:7"
label-song = " %artist% - %title%"
label-song-maxlen = 25
label-song-ellipsis = true
label-time = "%elapsed% / %total%"
label-offline = " Offline"
icon-play = "契"
icon-pause = ""
icon-stop = "栗"
icon-prev = "玲"
icon-next = "怜"
icon-seekb = ""
icon-seekf = ""
icon-random = ""
icon-repeat = ""
icon-repeatone = ""
icon-single = ""
icon-consume = ""
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "music"
native-decoration = false
native-action = ""
label-prev = "%{A1:previous:}玲%{A}"
label-next = "%{A1:next:}怜%{A}"
label-stop = "%{A1:stop:}栗%{A}"
label-play = "%{A1:toggle:}契%{A}"
label-pause = "%{A1:toggle:}%{A}"
label-toggle = "%{A1:toggle:}<label-toggle>%{A}"
label-repeat = "%{A1:toggle:}%{A}"
label-random = "%{A1:toggle:}%{A}"
label-single = "%{A1:toggle:}%{A}"
label-consume = "%{A1:toggle:}%{A}"
label-online-prefix = ""
label-offline-prefix = ""

[widgets.script.adi_right7]
content-background = "pywal:0"
content-foreground = "pywal:5"
content-font = 2
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = ""
label-background = "pywal:0"
label-foreground = "pywal:5"
label-font = 2

[widgets.script.adi_color_switch]
content-background = "pywal:7"
content-foreground = "pywal:15"
content-padding = 1
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=29.33"
native-source = "text"
native-decoration = false
native-action = "shuffle-colors"
format = "<label>"
