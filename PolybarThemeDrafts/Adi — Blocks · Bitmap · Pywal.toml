# Adapted from adi1090x/polybar-themes; GPL-3.0.
# Source: bitmap/blocks/config.ini
theme = "system"
preset = "flat-dark"
use-pywal = true

[appearance]
roundness = 0.0
border-width = 0.0
border-opacity = 1
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
glow-opacity = 0
bar-font-name = "GlanceTerminus14-Regular"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "GlanceTerminus14-Regular"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#2f343f"
foreground-color = "#1C1E20"
accent-color = "#B4BC67"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 34.0
top-margin = 0
reference-width = 1920
scale-content = false
margin = 0
floating-width = 0
horizontal-alignment = "left"
horizontal-padding = 0.0
spacing = 0.0
gap = 0

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.adi_sep", "script.adi_launcher", "script.adi_sep", "script.adi_workspaces", "script.adi_sep", "script.adi_mpd", "spacer", "script.adi_title", "spacer", "script.adi_color_switch", "script.adi_sep", "script.adi_alsa", "script.adi_sep", "script.adi_sep", "script.adi_network", "script.adi_sep", "script.adi_date", "script.adi_sep", "script.adi_sysmenu", "script.adi_sep"]

[widgets.pywal]
foreground-index = 15
accent-index = 4
border1-index = 8
border2-index = 8
background-index = 0

[widgets.script.adi_sep]
content-background = "pywal:0"
content-foreground = "pywal:0"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = "|"
label-background = "pywal:0"
label-foreground = "pywal:0"

[widgets.script.adi_launcher]
content-prefix = ""
content-prefix-background = "pywal:6"
content-prefix-padding = 1
content-background = "pywal:8"
content-foreground = "pywal:15"
content-overline = "pywal:0"
content-underline = "pywal:0"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "launcher"
format = "<label-prefix><label>"
label = " Menu "
label-prefix = ""
label-prefix-background = "pywal:6"
label-prefix-padding = 1
label-background = "pywal:8"
label-foreground = "pywal:15"
label-overline = "pywal:0"
label-underline = "pywal:0"

[widgets.script.adi_workspaces]
icon-0 = "1;"
icon-1 = "2;"
icon-2 = "3;"
icon-3 = "4;"
icon-4 = "5;"
icon-default = ""
format = "<label-state>"
format-overline = "pywal:0"
format-underline = "pywal:0"
label-monitor = "%name%"
label-active = "%icon%"
label-active-foreground = "pywal:15"
label-active-background = "pywal:4"
label-occupied = "%icon%"
label-occupied-foreground = "pywal:15"
label-occupied-background = "pywal:8"
label-urgent = "%icon%"
label-urgent-foreground = "pywal:15"
label-urgent-background = "pywal:1"
label-empty = "%icon%"
label-empty-foreground = "pywal:15"
label-empty-background = "pywal:8"
label-active-padding = 1
label-urgent-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "workspaces"
native-decoration = false
native-action = ""

[widgets.script.adi_mpd]
format-online = "<label-toggle><label-song><label-next>"
format-online-overline = "pywal:0"
format-online-underline = "pywal:0"
format-offline = "<label-offline-prefix><label-offline>"
format-offline-overline = "pywal:0"
format-offline-underline = "pywal:0"
label-song = "%artist% - %title%"
label-song-maxlen = 25
label-song-ellipsis = true
label-song-background = "pywal:8"
label-song-padding = 1
label-time = "%elapsed% / %total%"
label-time-background = "pywal:8"
label-time-padding = 1
label-offline = "Offline"
label-offline-background = "pywal:8"
label-offline-padding = 1
icon-play = ""
icon-play-background = "pywal:1"
icon-play-padding = 1
icon-pause = ""
icon-pause-padding = 1
icon-pause-background = "pywal:2"
icon-stop = " "
icon-stop-background = "pywal:8"
icon-next = " "
icon-next-background = "pywal:8"
icon-prev = " "
icon-prev-background = "pywal:8"
icon-seekf = ""
icon-seekb = ""
icon-random = ""
icon-repeat = ""
icon-repeatone = ""
icon-single = ""
icon-consume = ""
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "music"
native-decoration = false
native-action = ""
label-prev = "%{A1:previous:} %{A}"
label-prev-background = "pywal:8"
label-next = "%{A1:next:} %{A}"
label-next-background = "pywal:8"
label-stop = "%{A1:stop:} %{A}"
label-stop-background = "pywal:8"
label-play = "%{A1:toggle:}%{A}"
label-play-background = "pywal:1"
label-play-padding = 1
label-pause = "%{A1:toggle:}%{A}"
label-pause-background = "pywal:2"
label-pause-padding = 1
label-toggle = "%{A1:toggle:}<label-toggle>%{A}"
label-repeat = "%{A1:toggle:}%{A}"
label-random = "%{A1:toggle:}%{A}"
label-single = "%{A1:toggle:}%{A}"
label-consume = "%{A1:toggle:}%{A}"
label-offline-prefix = ""
label-offline-prefix-background = "pywal:1"
label-offline-prefix-padding = 1

[widgets.script.adi_title]
format = "<label-prefix><label>"
format-padding = 1
format-foreground = "pywal:7"
label = " %title%"
label-maxlen = 30
label-empty = " Desktop"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "window"
native-decoration = false
native-action = ""
label-prefix = ""

[widgets.script.adi_color_switch]
content-prefix = ""
content-prefix-background = "pywal:11"
content-prefix-padding = 1
content-background = "pywal:8"
content-foreground = "pywal:15"
content-overline = "pywal:0"
content-underline = "pywal:0"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "shuffle-colors"
format = "<label-prefix><label>"
label = " Style "
label-prefix = ""
label-prefix-background = "pywal:11"
label-prefix-padding = 1
label-background = "pywal:8"
label-foreground = "pywal:15"
label-overline = "pywal:0"
label-underline = "pywal:0"

[widgets.script.adi_alsa]
format-volume = "<ramp-volume><label-volume>"
format-volume-overline = "pywal:0"
format-volume-underline = "pywal:0"
format-muted = "<label-muted-prefix><label-muted>"
format-muted-overline = "pywal:0"
format-muted-underline = "pywal:0"
label-volume = "%percentage%%"
label-volume-background = "pywal:8"
label-volume-padding = 1
label-muted = "Muted"
label-muted-foreground = "pywal:15"
label-muted-background = "pywal:8"
label-muted-padding = 1
ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
ramp-volume-3 = ""
ramp-volume-4 = ""
ramp-volume-background = "pywal:4"
ramp-volume-padding = 1
ramp-headphones-0 = ""
ramp-headphones-background = "pywal:4"
ramp-headphones-padding = 1
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "volume"
native-decoration = false
native-action = ""
label-muted-prefix = ""
label-muted-prefix-background = "pywal:1"
label-muted-prefix-padding = 1

[widgets.script.adi_network]
format-connected = "<ramp-signal><label-connected>"
format-connected-overline = "pywal:0"
format-connected-underline = "pywal:0"
format-disconnected = "<label-disconnected-prefix><label-disconnected>"
format-disconnected-overline = "pywal:0"
format-disconnected-underline = "pywal:0"
label-connected = "%{A1:network:}%essid%%{A}"
label-connected-background = "pywal:8"
label-connected-padding = 1
label-disconnected = "%{A1:network:}Offline%{A}"
label-disconnected-background = "pywal:8"
label-disconnected-padding = 1
ramp-signal-0 = ""
ramp-signal-1 = ""
ramp-signal-2 = ""
ramp-signal-3 = ""
ramp-signal-background = "pywal:5"
ramp-signal-padding = 1
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "network"
native-decoration = false
native-action = ""
label-disconnected-prefix = ""
label-disconnected-prefix-background = "pywal:11"
label-disconnected-prefix-padding = 1

[widgets.script.adi_date]
format = "<label-prefix><label>"
format-overline = "pywal:0"
format-underline = "pywal:0"
label = "%time%"
label-background = "pywal:8"
label-padding = 1
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "date"
native-decoration = false
native-action = ""
date-pattern = ""
time-pattern = "hh:mm a"
seconds = false
label-prefix = ""
label-prefix-background = "pywal:11"
label-prefix-padding = 1

[widgets.script.adi_sysmenu]
content-prefix = ""
content-prefix-background = "pywal:6"
content-prefix-padding = 1
content-background = "pywal:8"
content-foreground = "pywal:15"
content-overline = "pywal:0"
content-underline = "pywal:0"
font-0 = "GlanceTerminus14-Regular:size=14"
font-1 = "GlanceWaffle10-Regular:size=14"
native-source = "text"
native-decoration = false
native-action = "power"
format = "<label-prefix><label>"
label = " System "
label-prefix = ""
label-prefix-background = "pywal:6"
label-prefix-padding = 1
label-background = "pywal:8"
label-foreground = "pywal:15"
label-overline = "pywal:0"
label-underline = "pywal:0"
