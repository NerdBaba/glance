# Randomazzo preset inspired by kiddae/polybar-themes/san.
# Bundled and imported without overwriting existing presets.
theme = "system"
preset = "flat-dark"
use-pywal = true

[appearance]
roundness = 24
border-width = 0
border-opacity = 0.45
fill-opacity = 1
shadow-opacity = 0.0
shadow-radius = 0.0
bar-font-name = "SatoshiVariable-Bold"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "SatoshiVariable-Bold"
widget-font-size = 14
widget-font-weight = 3

[experimental.foreground]
scale-content = false
formation = "floating"
position = "top"
height = 38
top-margin = 6
margin = 12
horizontal-padding = 14
spacing = 9
gap = 8

floating-width = 0
horizontal-alignment = "center"
[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["default.launcher", "default.spaces", "default.activeapp", "spacer", "default.nowplaying", "default.mediacontrols", "spacer", "default.brightness", "default.volume", "default.network", "default.time", "default.power"]
[widgets.default.spaces.space]
display-mode = "dots"
highlight = "pill"
icon-style = "sf-symbols"
tint-icons = true
show-key = false

[widgets.default.nowplaying]
show-icon = true
show-title = true
show-artist = true
show-album = false
show-visualizer = false
title-max-length = 26
artist-max-length = 16

[widgets.default.time]
format = "EEE d MMM · HH:mm"
calendar.format = "H:mm"
calendar.show-events = false

[widgets.default.volume]
display-mode = "icon-value"
show-percentage = true

[widgets.default.systemmonitor]
cpu-display-mode = "icon-value"
mem-display-mode = "icon-value"

[widgets.default.launcher]
display-mode = "icon"
label = "Apps"
symbol = "chevron.up"

[widgets.default.power]
display-mode = "icon"
label = "Power"
symbol = "power"

[widgets.widget-colors]
mode = "disabled"
"default.spaces" = 8
"default.activeapp" = 9
"default.nowplaying" = 10
"default.weather" = 11
"default.time" = 12
"default.energy" = 13
"default.fan" = 14
"default.temperature" = 15
"default.systemmonitor" = 8
"default.network" = 9
"default.volume" = 10
"default.power" = 11
"default.launcher" = 12


"default.mediacontrols" = 10
[widgets.default.mediacontrols]
show-previous = true
show-play-pause = true
show-next = true

[widgets.default.network]

display-mode = "ip"
wifi-display-mode = "icon"

[widgets.pywal]

foreground-index = 15
accent-index = 4
background-index = 0
border1-index = 4
border2-index = 4

