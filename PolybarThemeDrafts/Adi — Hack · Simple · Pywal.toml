# Adapted from adi1090x/polybar-themes; GPL-3.0.
# Source: simple/hack/config.ini
theme = "system"
preset = "flat-dark"
use-pywal = true

[appearance]
roundness = 0.0
border-width = 0.0
border-opacity = 1
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
glow-opacity = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#263238"
foreground-color = "#DFDFDF"
accent-color = "#00BCD4"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 26.0
top-margin = 0
reference-width = 1920
scale-content = false
margin = 0
floating-width = 0
horizontal-alignment = "left"
horizontal-padding = 7.0
spacing = 0.0
gap = 0

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.adi_launcher", "script.adi_sep", "script.adi_title", "spacer", "script.adi_workspaces", "spacer", "script.adi_color_switch", "script.adi_sep", "script.adi_sep", "script.adi_checknet", "script.adi_sep", "script.adi_date", "script.adi_sep", "script.adi_sysmenu"]

[widgets.pywal]
foreground-index = 15
accent-index = 4
border1-index = 8
border2-index = 8
background-index = 0

[widgets.script.adi_launcher]
content-foreground = "pywal:4"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "text"
native-decoration = false
native-action = "launcher"
format = "<label>"
label = "﩯"
label-foreground = "pywal:4"

[widgets.script.adi_sep]
content-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = " | "
label-foreground = "pywal:0"

[widgets.script.adi_title]
format = "<label>"
label = "%title%"
label-maxlen = 30
label-empty = "Desktop"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "window"
native-decoration = false
native-action = ""

[widgets.script.adi_workspaces]
icon-0 = "1;﬏"
icon-1 = "2;"
icon-2 = "3;"
icon-3 = "4;"
icon-4 = "5;"
icon-default = ""
format = "<label-state>"
format-padding = 1
label-monitor = "%name%"
label-active = "%icon%"
label-active-foreground = "pywal:4"
label-occupied = "%icon%"
label-occupied-foreground = "pywal:3"
label-urgent = "%icon%"
label-urgent-foreground = "pywal:1"
label-empty = "%icon%"
label-active-padding = 2
label-urgent-padding = 2
label-occupied-padding = 2
label-empty-padding = 2
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "workspaces"
native-decoration = false
native-action = ""

[widgets.script.adi_color_switch]
content-foreground = "pywal:4"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "text"
native-decoration = false
native-action = "shuffle-colors"
format = "<label>"
label = ""
label-foreground = "pywal:4"

[widgets.script.adi_checknet]
format = "<label>"
label = "Connected"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "network"
native-decoration = false
native-action = ""
token-output = ""

[widgets.script.adi_date]
format = "<label>"
label = "%time%"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "date"
native-decoration = false
native-action = ""
date-pattern = ""
time-pattern = " hh:mm a"
seconds = false

[widgets.script.adi_sysmenu]
content-foreground = "pywal:4"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "text"
native-decoration = false
native-action = "power"
format = "<label>"
label = ""
label-foreground = "pywal:4"

[additional-bars]

[additional-bars.bottom]
theme = "system"
preset = "flat-dark"
use-pywal = true

[additional-bars.bottom.appearance]
roundness = 0.0
border-width = 0.0
border-opacity = 1
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
glow-opacity = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#263238"
foreground-color = "#DFDFDF"
accent-color = "#00BCD4"

[additional-bars.bottom.experimental]

[additional-bars.bottom.experimental.foreground]
formation = "full"
position = "bottom"
height = 26.0
top-margin = 0
reference-width = 1920
scale-content = false
margin = 0
floating-width = 0
horizontal-alignment = "left"
horizontal-padding = 7.0
spacing = 0.0
gap = 0

[additional-bars.bottom.experimental.foreground.widgets-background]
displayed = true

[additional-bars.bottom.experimental.background]
displayed = false

[additional-bars.bottom.widgets]
displayed = ["script.adi_mpd", "spacer", "script.adi_cpu", "script.adi_sep", "script.adi_memory", "script.adi_sep", "script.adi_filesystem", "script.adi_sep", "script.adi_temperature", "script.adi_sep", "script.adi_updates", "script.adi_sep", "script.adi_speed", "spacer", "script.adi_volume", "script.adi_sep", "script.adi_brightness"]

[additional-bars.bottom.widgets.pywal]
foreground-index = 15
accent-index = 4
border1-index = 8
border2-index = 8
background-index = 0

[additional-bars.bottom.widgets.script.adi_mpd]
format-online = "<label-online-prefix><label-song> <label-prev> <label-toggle> <label-next>"
format-online-foreground = "pywal:15"
format-offline = "<label-offline-prefix><label-offline>"
format-offline-foreground = "pywal:15"
label-song = " %artist% - %title%"
label-song-maxlen = 25
label-song-ellipsis = true
label-time = "%elapsed% / %total%"
label-offline = " Offline"
icon-play = ""
icon-pause = ""
icon-stop = ""
icon-prev = ""
icon-next = ""
icon-seekb = ""
icon-seekf = ""
icon-random = ""
icon-repeat = ""
icon-repeatone = ""
icon-single = ""
icon-consume = ""
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "music"
native-decoration = false
native-action = ""
label-prev = "%{A1:previous:}%{A}"
label-next = "%{A1:next:}%{A}"
label-stop = "%{A1:stop:}%{A}"
label-play = "%{A1:toggle:}%{A}"
label-pause = "%{A1:toggle:}%{A}"
label-toggle = "%{A1:toggle:}<label-toggle>%{A}"
label-repeat = "%{A1:toggle:}%{A}"
label-random = "%{A1:toggle:}%{A}"
label-single = "%{A1:toggle:}%{A}"
label-consume = "%{A1:toggle:}%{A}"
label-online-prefix = "ﱘ"
label-offline-prefix = "ﱘ"

[additional-bars.bottom.widgets.script.adi_cpu]
format = "<label-prefix><label>"
label = " %percentage%%"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "cpu"
native-decoration = false
native-action = ""
label-prefix = ""

[additional-bars.bottom.widgets.script.adi_sep]
content-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "text"
native-decoration = true
native-action = ""
format = "<label>"
label = " | "
label-foreground = "pywal:0"

[additional-bars.bottom.widgets.script.adi_memory]
format = "<label-prefix><label>"
label = " %mb_used%"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "memory"
native-decoration = false
native-action = ""
label-prefix = ""

[additional-bars.bottom.widgets.script.adi_filesystem]
format-mounted = "<label-mounted-prefix><label-mounted>"
format-unmounted = "<label-unmounted-prefix><label-unmounted>"
label-mounted = " %free%"
label-unmounted = " %mountpoint%: not mounted"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "disk"
native-decoration = false
native-action = ""
label-mounted-prefix = ""
label-unmounted-prefix = ""

[additional-bars.bottom.widgets.script.adi_temperature]
format = "<ramp> <label>"
format-warn = "<ramp> <label-warn>"
label = "%temperature-c%"
label-warn = "%temperature-c%"
label-warn-foreground = "pywal:1"
ramp-0 = ""
ramp-1 = ""
ramp-2 = ""
ramp-3 = ""
ramp-4 = ""
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "temperature"
native-decoration = false
native-action = ""

[additional-bars.bottom.widgets.script.adi_updates]
format = "<label-prefix><label>"
label = "Updates"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "text"
native-decoration = false
native-action = "updates"
label-prefix = " "

[additional-bars.bottom.widgets.script.adi_speed]
format-connected = "<label-connected-prefix><label-connected>"
format-disconnected = "<label-disconnected-prefix><label-disconnected>"
label-connected = "%{A1:network:} %essid%  %downspeed% 祝 %upspeed%%{A}"
label-disconnected = "%{A1:network:} Disconnected%{A}"
ramp-signal-0 = ""
ramp-signal-1 = ""
ramp-signal-2 = ""
ramp-signal-3 = ""
ramp-signal-4 = ""
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "network"
native-decoration = false
native-action = ""
label-connected-prefix = "直"
label-disconnected-prefix = "睊"

[additional-bars.bottom.widgets.script.adi_volume]
format-volume = "<ramp-volume> <bar-volume>"
format-muted-prefix = ""
label-volume = "%percentage%%"
label-muted = " Muted"
label-muted-foreground = "pywal:1"
ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
bar-volume-width = 10
bar-volume-gradient = false
bar-volume-indicator = "⏽"
bar-volume-indicator-foreground = "pywal:15"
bar-volume-fill = ""
bar-volume-foreground-0 = "pywal:2"
bar-volume-foreground-1 = "pywal:2"
bar-volume-foreground-2 = "pywal:3"
bar-volume-foreground-3 = "pywal:3"
bar-volume-foreground-4 = "pywal:1"
bar-volume-empty = ""
bar-volume-empty-foreground = "pywal:15"
ramp-headphones-0 = ""
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "volume"
native-decoration = false
native-action = ""

[additional-bars.bottom.widgets.script.adi_brightness]
format = "<label-prefix><bar>"
label = "%percentage%%"
ramp-0 = ""
ramp-1 = ""
ramp-2 = ""
ramp-3 = ""
ramp-4 = ""
bar-width = 10
bar-gradient = false
bar-indicator = "⏽"
bar-indicator-foreground = "pywal:15"
bar-fill = ""
bar-foreground-0 = "pywal:2"
bar-foreground-1 = "pywal:2"
bar-foreground-2 = "pywal:3"
bar-foreground-3 = "pywal:3"
bar-foreground-4 = "pywal:1"
bar-empty = ""
bar-empty-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
font-1 = "IosevkaNerdFontComplete-:size=14"
native-source = "brightness"
native-decoration = false
native-action = ""
label-prefix = "盛 "
