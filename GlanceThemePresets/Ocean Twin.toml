# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#1c4056"
foreground-color = "#9dc0d3"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 34
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 6
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.window", "spacer", "script.term", "script.web", "script.files", "script.editor", "spacer", "script.palette", "script.network", "script.clock", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"

[widgets.script.window]
native-source = "window"
format = "<label>"
label = "%title%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-height = 26

[widgets.script.term]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "terminal"
native-action = "terminal"

[widgets.script.web]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "folder.fill"
native-action = "files"

[widgets.script.editor]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.and.pencil"
native-action = "open-app"
action-app = "/Applications/Visual Studio Code.app"

[widgets.script.palette]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "paintpalette.fill"
format-height = 26
native-action = "shuffle-colors"

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%output%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%output%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "clock"
time-pattern = "hh:mm a"
date-pattern = "dd-MM-yy"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 26
native-action = "power"

[additional-bars]

[additional-bars.bottom]
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[additional-bars.bottom.appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#201f32"
foreground-color = "#b06c6b"

[additional-bars.bottom.experimental]

[additional-bars.bottom.experimental.foreground]
formation = "full"
position = "bottom"
height = 34
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 5
scale-content = false

[additional-bars.bottom.experimental.foreground.widgets-background]
displayed = true

[additional-bars.bottom.experimental.background]
displayed = false

[additional-bars.bottom.widgets]
displayed = ["script.music", "spacer", "script.cpu", "script.memory", "script.disk", "script.temperature", "script.network", "spacer", "script.volume", "script.brightness"]

[additional-bars.bottom.widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[additional-bars.bottom.widgets.widget-colors]
mode = "disabled"

[additional-bars.bottom.widgets.script]

[additional-bars.bottom.widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-online = "<label-prefix> <label-song> <label-prev> <label-toggle> <label-next>"
format-offline = "<label-prefix> <label>"
label-song = "%title%"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "music.note"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""

[additional-bars.bottom.widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "chart.bar.fill"
format-height = 26

[additional-bars.bottom.widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%mb_used% MiB"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"
format-height = 26

[additional-bars.bottom.widgets.script.disk]
native-source = "disk"
format = "<label-prefix> <label>"
label = "%free%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "externaldrive.fill"
format-height = 26

[additional-bars.bottom.widgets.script.temperature]
native-source = "temperature"
format = "<label-prefix> <label>"
label = "%temperature-c%°C"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "thermometer"
format-height = 26

[additional-bars.bottom.widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%  ↓ %downspeed%  ↑ %upspeed%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%  ↓ %downspeed%  ↑ %upspeed%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[additional-bars.bottom.widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <bar-volume>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26
bar-volume-width = 10
bar-volume-fill = "━"
bar-volume-empty = "─"
bar-volume-indicator = "┃"
bar-volume-foreground-0 = "pywal:6"

[additional-bars.bottom.widgets.script.brightness]
native-source = "brightness"
format = "<label-prefix> <bar-brightness>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "sun.max.fill"
format-height = 26
bar-brightness-width = 10
bar-brightness-fill = "━"
bar-brightness-empty = "─"
bar-brightness-indicator = "┃"
bar-brightness-foreground-0 = "pywal:10"
