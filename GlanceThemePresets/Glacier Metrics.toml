# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#2c303b"
foreground-color = "#b1bece"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 32
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 7
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "spacer", "script.spaces", "spacer", "script.cpu", "script.temperature", "script.gpu", "script.memory", "script.network", "script.volume", "script.clock", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=18"
format-background = "pywal:15"
format-height = 24
format-radius = 12
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1

[widgets.script.cpu]
native-source = "cpu"
format = "<label>"
label = "CPU %percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-height = 26
format-radius = 12

[widgets.script.temperature]
native-source = "temperature"
format = "<label>"
label = "CPU %temperature-c%°C"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-height = 26
format-radius = 12

[widgets.script.gpu]
native-source = "text"
format = "<label>"
label = "GPU —"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-height = 26
format-radius = 12
module-name = "GPU (custom data)"

[widgets.script.memory]
native-source = "memory"
format = "<label>"
label = "RAM %percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-height = 26
format-radius = 12

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-background = "pywal:8"
format-height = 26
format-radius = 12
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:15"
format-height = 26
format-radius = 12

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%date%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:15"
format-height = 24
format-radius = 12
time-pattern = "HH:mm"
date-pattern = "dd/MM/yyyy"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 26
native-action = "power"
