# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#201f32"
foreground-color = "#f5edf0"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 36
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 6
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.cpu", "script.memory", "script.storage", "script.updates", "spacer", "script.music", "script.recording", "spacer", "script.volume", "script.weather", "script.network", "script.clock", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:9"
format-height = 26
format-radius = 4
native-action = "launcher"

[widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "LOAD: %percentage%%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "chart.xyaxis.line"
format-background = "pywal:10"
format-height = 26
format-radius = 4

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "USED: %gb_used%G"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "chart.pie.fill"
format-background = "pywal:11"
format-height = 26
format-radius = 4

[widgets.script.storage]
native-source = "disk"
format = "<label-prefix> <label>"
label = "FREE: %free%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "externaldrive.fill"
format-background = "pywal:12"
format-height = 26
format-radius = 4

[widgets.script.updates]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "shippingbox.fill"
format-background = "pywal:14"
format-height = 26
format-radius = 4
native-action = "updates"

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:10"
format-height = 26
format-radius = 4
format-online = "<label-prefix> <label-song>"
format-offline = "<label-prefix> <label>"
label-song = "%artist% - %title%"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "play.circle.fill"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""

[widgets.script.recording]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "record.circle"
format-background = "pywal:12"
format-height = 26
format-radius = 4
native-action = "open-app"
module-name = "Recording App"
action-app = "/System/Applications/QuickTime Player.app"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:9"
format-height = 26
format-radius = 4

[widgets.script.weather]
native-source = "weather"
format = "<label-prefix> <label>"
label = "%temperature%(%feels-like%) °C"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cloud.sun.fill"
format-background = "pywal:12"
format-height = 26
format-radius = 4

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%local_ip%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "network"
format-background = "pywal:13"
format-height = 26
format-radius = 4
format-connected = "<label-prefix> <label-connected>"
label-connected = "%local_ip%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "%local_ip%"

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "clock"
format-background = "pywal:14"
format-height = 26
format-radius = 4
time-pattern = "HH:mm"
date-pattern = "dd-MM-yy"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-background = "pywal:11"
format-height = 26
format-radius = 4
native-action = "power"
