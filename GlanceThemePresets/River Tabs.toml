# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#1c2125"
foreground-color = "#a9b9b8"

[experimental]

[experimental.foreground]
formation = "full"
position = "bottom"
height = 36
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 2
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.term", "script.web", "script.files", "script.aux", "script.music_app", "script.window", "script.spaces", "spacer", "script.clock", "spacer", "script.network", "script.bluetooth", "script.volume", "script.temperature", "script.memory", "script.cpu", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.term]
native-source = "text"
format = "<label>"
label = "term"
format-padding = "12px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
native-action = "terminal"
format-border-width = 1
format-border-color = "pywal:10"
format-height = 32

[widgets.script.web]
native-source = "text"
format = "<label>"
label = "web"
format-padding = "12px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
native-action = "browser"
format-border-width = 1
format-border-color = "pywal:10"
format-height = 32

[widgets.script.files]
native-source = "text"
format = "<label>"
label = "files"
format-padding = "12px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
native-action = "files"
format-border-width = 1
format-border-color = "pywal:10"
format-height = 32

[widgets.script.aux]
native-source = "text"
format = "<label>"
label = "aux"
format-padding = "12px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
native-action = "settings"
format-border-width = 1
format-border-color = "pywal:10"
format-height = 32

[widgets.script.music_app]
native-source = "text"
format = "<label>"
label = "music"
format-padding = "12px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
native-action = "open-app"
action-app = "/System/Applications/Music.app"
format-border-width = 1
format-border-color = "pywal:10"
format-height = 32

[widgets.script.window]
native-source = "window"
format = "<label>"
label = "%title%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:10"
format-height = 32
format-min-width = 320
format-alignment = "left"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "%index%"
label-active-foreground = "pywal:9"
label-focused = "%index%"
label-focused-foreground = "pywal:9"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
native-display-mode = "focused-only"
format-background = "pywal:10"

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
time-pattern = "MM-dd HH:mm"
date-pattern = "dd-MM-yy"

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.bluetooth]
native-source = "bluetooth"
format = "<label-prefix> <label>"
label = "%count%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-height = 26
label-prefix = ""
native-action = "bluetooth"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26

[widgets.script.temperature]
native-source = "temperature"
format = "<label-prefix> <label>"
label = "%temperature-c%°C"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "thermometer"
format-height = 26

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"
format-height = 26

[widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cpu"
format-height = 26

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 26
native-action = "power"
