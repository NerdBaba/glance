# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#201f32"
foreground-color = "#f5edf0"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 40
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 4
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.spaces", "spacer", "script.music", "spacer", "script.keyboard", "script.network", "script.volume", "script.brightness", "script.cpu", "script.memory", "script.temperature", "script.clock"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "%index%"
label-active-foreground = "pywal:9"
label-focused = "%index%"
label-focused-foreground = "pywal:9"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:0"
format-height = 32
format-radius = 10
format-online = "<label-prev> <label-toggle> <label-next> <label-song> <label-prefix>"
format-offline = "<label-prefix> <label>"
label-song = "%title% (%elapsed%/%total%)"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "music.note"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""

[widgets.script.keyboard]
native-source = "keyboard"
format = "<label-prefix> <label>"
label = "%layout%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:12"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-connected = "<label-prefix> <label-connected>"
label-connected = "%percentage%%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:10"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"

[widgets.script.brightness]
native-source = "brightness"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:10"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "moon.fill"

[widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:14"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cpu"

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:11"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"

[widgets.script.temperature]
native-source = "temperature"
format = "<label-prefix> <label>"
label = "%temperature-c%°C"
format-padding = "6px"
format-foreground = "pywal:12"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "thermometer"

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "clock"
time-pattern = "HH:mm"
date-pattern = "dd-MM-yy"
