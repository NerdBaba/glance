[widgets.script.window]
native-source = "window"
format = "<label>"
label = "%name%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue-Medium:size=14"
format-height = 76
native-text-direction = "down"
label-maxlen = 10
format-font-name = "HelveticaNeue-Medium"
format-font-size = 14
font-min-size = 6
native-icon-size = 16
format-font-weight = 3

format-offset-y = 0

capsule-group = "focus"

label-ellipsis = true

[widgets.script.music_app]
native-source = "text"
