[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=14"
label-active = "●"
label-active-foreground = "pywal:15"
label-focused = "●"
label-focused-foreground = "pywal:15"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
native-orientation = "vertical"
workspace-indicator = "ring-active"
workspace-dot-size = 7
workspace-dot-spacing = 4
workspace-hit-height = 22
workspace-inactive-opacity = 0.35
label-empty-foreground = "pywal:15"
label-occupied-foreground = "pywal:15"
native-decoration = true
capsule-group = "navigation"
format-font-name = "HelveticaNeue"
format-font-size = 14
font-min-size = 6
