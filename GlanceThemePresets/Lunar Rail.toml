[widgets.script.games]
native-source = "text"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "FontAwesome6Brands-Regular:size=16"
format-height = 28
native-action = "open-app"
action-app = "/Applications/Steam.app"
capsule-group = "lower"
format-font-name = "FontAwesome6Brands-Regular"
format-font-size = 16
font-min-size = 6
native-icon-size = 16
format-font-weight = 3

format-offset-y = 0

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%date%\n─\n%time%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=14"
format-height = 136
format-radius = 0
time-pattern = "hh\nmm\na"
date-pattern = "EEE\nd"
native-line-limit = 6
format-min-width = 40
date-layout = "rail"
rail-clock-spacing = 4
native-decoration = false
format-offset-y = 0
capsule-group = "lower"
format-font-name = "HelveticaNeue"
format-font-size = 14
font-min-size = 6
native-icon-size = 16
format-font-weight = 3

rail-weekday-font = "HelveticaNeue:size=13"

rail-date-font = "HelveticaNeue-Medium:size=16"

rail-time-font = "HelveticaNeue-Medium:size=16"

rail-period-font = "HelveticaNeue:size=13"

[widgets.script.power]
