# Glance preset. Approved for Randomazzo on 2026-10-10.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 0
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "HelveticaNeue"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "HelveticaNeue"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#08090e"
foreground-color = "#a0a0b8"

[experimental]

[experimental.foreground]
formation = "full"
position = "left"
height = 56
top-margin = 0
margin = 0
horizontal-padding = 12
spacing = 8
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.launcher", "script.layout", "script.files", "script.editor", "script.terminal", "script.notes", "script.palette", "script.spaces", "spacer", "script.window_icon", "script.window", "spacer", "script.music_app", "script.games", "script.clock", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.launcher]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=14"
label-prefix = ""
native-symbol-label-prefix = "glance.pacman"
format-height = 28
native-action = "launcher"
capsule-group = "navigation"
capsule-background = "pywal:0"
capsule-background-opacity = 0.94
capsule-width = 40
capsule-vertical-padding = 10
capsule-spacing = 4
capsule-radius = 20
format-font-name = "HelveticaNeue"
format-font-size = 14
font-min-size = 6
native-icon-size = 16
format-font-weight = 3

format-offset-y = 0

