# Glance preset. Approved for Randomazzo on 2026-10-10.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "Menlo-Regular"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "Menlo-Regular"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#141211"
foreground-color = "#baa787"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 24
top-margin = 0
margin = 0
horizontal-padding = 10
spacing = 5
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.identity", "script.window", "spacer", "script.workspace_prefix", "script.spaces", "script.workspace_suffix"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.identity]
native-source = "text"
format = "<label>"
label = "%user%@%host%:"
format-padding = "0px"
format-foreground = "pywal:9"
font-0 = "Menlo-Regular:size=14"
label-maxlen = 40
module-name = "Login identity"
format-font-name = "Menlo-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.window]
native-source = "window"
format = "<label>"
label = "%name%"
format-padding = "0px"
format-foreground = "pywal:4"
font-0 = "Menlo-Regular:size=14"
label-maxlen = 28
format-font-name = "Menlo-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:4"
font-0 = "Menlo-Regular:size=14"
label-active = "%index%"
label-active-foreground = "pywal:11"
label-focused = "%index%"
label-focused-foreground = "pywal:11"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 0
label-focused-padding = 0
label-occupied-padding = 0
label-empty-padding = 0
workspace-label-spacing = 11
label-empty-foreground = "pywal:4"
label-occupied-foreground = "pywal:4"
format-font-name = "Menlo-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.workspace_prefix]
native-source = "text"
format = "<label>"
label = "W: ("
format-padding = "0px"
format-foreground = "pywal:11"
font-0 = "Menlo-Regular:size=14"
format-font-name = "Menlo-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.workspace_suffix]
native-source = "text"
format = "<label>"
label = ")"
format-padding = "0px"
format-foreground = "pywal:4"
font-0 = "Menlo-Regular:size=14"
format-font-name = "Menlo-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3
