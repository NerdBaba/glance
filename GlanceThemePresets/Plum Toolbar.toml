# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#1f1f29"
foreground-color = "#dcdde1"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 38
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 5
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.music", "script.palette", "script.music_app", "script.term", "script.web", "script.files", "spacer", "script.spaces", "spacer", "script.volume", "script.brightness", "script.bluetooth", "script.network", "script.clock", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-height = 28
format-radius = 7
format-online = "<label-prefix> <label-song>"
format-offline = "<label-prefix> <label>"
label-song = "%artist% - %title%"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "music.note"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""

[widgets.script.palette]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "paintpalette.fill"
format-background = "pywal:9"
format-height = 26
format-radius = 7
native-action = "shuffle-colors"

[widgets.script.music_app]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "music.note"
format-background = "pywal:12"
format-height = 28
format-radius = 7
native-action = "open-app"
action-app = "/System/Applications/Music.app"

[widgets.script.term]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "terminal"
native-action = "terminal"

[widgets.script.web]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "folder.fill"
native-action = "files"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "%index%"
label-active-foreground = "pywal:9"
label-focused = "%index%"
label-focused-foreground = "pywal:9"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
label-active-underline = "pywal:9"
label-focused-underline = "pywal:9"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:8"
format-height = 26
format-radius = 8

[widgets.script.brightness]
native-source = "brightness"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "sun.max.fill"
format-background = "pywal:8"
format-height = 26
format-radius = 8

[widgets.script.bluetooth]
native-source = "bluetooth"
format = "<label-prefix> <label>"
label = "%count%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-height = 26
format-radius = 8
label-prefix = ""
native-action = "bluetooth"

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-background = "pywal:8"
format-height = 26
format-radius = 8
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "clock"
format-background = "pywal:8"
format-height = 28
format-radius = 8
time-pattern = "hh:mm a"
date-pattern = "dd-MM-yy"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-background = "pywal:9"
format-height = 26
format-radius = 8
native-action = "power"
