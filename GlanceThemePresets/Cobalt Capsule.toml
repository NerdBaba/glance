# Glance preset. Approved for Randomazzo on 2026-10-10.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 100
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "HelveticaNeue"
bar-font-size = 15.0
bar-font-weight = 3
widget-font-name = "HelveticaNeue"
widget-font-size = 15.0
widget-font-weight = 3
widget-background-color = "#000000"
foreground-color = "#b6b8ba"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 54.0
top-margin = 0.0
margin = 0.0
horizontal-padding = 15.0
spacing = 9.0
scale-content = false
floating-width = 690.0
floating-inset = 0.0
floating-flat-top = true
horizontal-alignment = "center"

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.spaces", "script.microphone", "script.recording", "spacer", "script.clock", "spacer", "script.cover", "script.music", "script.messages", "script.calendar", "script.brightness", "script.battery"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12.0"
label-active = "%icon%"
label-active-foreground = "pywal:15"
label-focused = "%icon%"
label-focused-foreground = "pywal:15"
label-occupied = "%icon%"
label-empty = "%icon%"
label-active-padding = 0
label-focused-padding = 0
label-occupied-padding = 0
label-empty-padding = 0
workspace-label-radius = 10.5
workspace-label-height = 21.0
workspace-label-width = 15.0
workspace-label-active-width = 21.0
workspace-label-spacing = 12.0
label-active-background = "pywal:4"
label-focused-background = "pywal:4"
label-occupied-foreground = "pywal:8"
label-empty-foreground = "pywal:8"
ws-icon-0 = "1;I"
ws-icon-1 = "2;II"
ws-icon-2 = "3;III"
ws-icon-3 = "4;IV"
ws-icon-4 = "5;V"
format-font-name = "HelveticaNeue"
format-font-size = 12.0
font-min-size = 6
native-icon-size = 21.0
format-font-weight = 3

[widgets.script.microphone]
native-source = "microphone"
format = "<label-prefix>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:11"
font-0 = "HelveticaNeue:size=15.0"
label-prefix = ""
native-symbol-label-prefix = "mic.fill"
native-icon-size = 13.5
format-padding-left = 48.0
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
format-font-weight = 3

[widgets.script.recording]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:10"
font-0 = "HelveticaNeue:size=15.0"
label-prefix = ""
native-symbol-label-prefix = "camera.fill"
native-action = "open-app"
native-icon-size = 9.0
module-name = "Recording application"
action-app = "/System/Applications/QuickTime Player.app"
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
format-font-weight = 3

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%{T2}%time%%{T3}  %date%"
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=15.0"
time-pattern = "HH:mm"
date-pattern = "EEE d MMM"
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
native-icon-size = 21.0
font-1 = "HelveticaNeue-Bold:size=15.0"
font-2 = "HelveticaNeue:size=13.5"
format-font-weight = 3

[widgets.script.cover]
native-source = "music-artwork"
format = "<label>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=15.0"
music-artwork-size = 21.0
music-artwork-radius = 4.5
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
native-icon-size = 21.0
format-font-weight = 3

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=15.0"
format-online = "<bar-music>"
format-offline = "<bar-music>"
label-song = "%title%"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""
bar-music-width = 7
bar-music-fill = "·"
bar-music-empty = "·"
bar-music-indicator = ""
bar-music-foreground-0 = "pywal:15"
bar-music-empty-foreground = "pywal:8"
format-min-width = 76.5
format-alignment = "left"
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
native-icon-size = 21.0
format-font-weight = 3

[widgets.script.messages]
native-source = "text"
format = "<label>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:4"
font-0 = "FontAwesome6Brands-Regular:size=15.0"
native-action = "open-app"
module-name = "Discord application"
format-padding-right = 4.5
action-app = "/Applications/Vesktop.app"
format-font-name = "FontAwesome6Brands-Regular"
format-font-size = 15.0
font-min-size = 6
native-icon-size = 21.0
format-font-weight = 3

[widgets.script.calendar]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=15.0"
label-prefix = ""
native-symbol-label-prefix = "calendar"
native-action = "open-app"
native-icon-size = 12.0
format-padding-right = 4.5
action-app = "/System/Applications/Calendar.app"
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
format-font-weight = 3

[widgets.script.brightness]
native-source = "brightness"
format = "<label-prefix>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=15.0"
label-prefix = ""
native-symbol-label-prefix = "sun.max.fill"
native-icon-size = 12.0
format-padding-right = 4.5
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
format-font-weight = 3

[widgets.script.battery]
native-source = "battery"
format = "<label-prefix>"
label = ""
format-padding = "0.0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=15.0"
label-prefix = ""
native-symbol-label-prefix = "battery.100"
native-icon-size = 10.5
native-text-direction = "up"
format-padding-right = 16.5
format-font-name = "HelveticaNeue"
format-font-size = 15.0
font-min-size = 6
format-font-weight = 3
