# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 45
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#f5f6fa"
foreground-color = "#44536a"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 50
top-margin = 0
margin = 160
horizontal-padding = 6
spacing = 7
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.spaces", "script.term", "script.web", "script.files", "spacer", "script.clock", "spacer", "script.volume", "script.disk", "script.cpu", "script.memory", "script.network", "script.updates"]

[widgets.pywal]
foreground-index = 0
background-index = 15
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=18"
format-background = "pywal:13"
format-height = 28
format-radius = 14
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "●"
label-empty = "●"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
workspace-color-1 = "pywal:15"
workspace-color-2 = "pywal:10"
workspace-color-3 = "pywal:9"
workspace-color-4 = "pywal:13"
workspace-color-5 = "pywal:12"
workspace-color-6 = "pywal:4"
workspace-color-7 = "pywal:8"
workspace-color-8 = "pywal:11"
workspace-color-9 = "pywal:6"
workspace-color-10 = "pywal:14"

[widgets.script.term]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "terminal"
native-action = "terminal"

[widgets.script.web]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "folder.fill"
native-action = "files"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <bar-volume>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26
bar-volume-width = 8
bar-volume-fill = "▰"
bar-volume-empty = "▱"
bar-volume-indicator = ""
bar-volume-foreground-0 = "pywal:14"
bar-volume-foreground-1 = "pywal:10"

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:13"
format-height = 28
format-radius = 14
time-pattern = "hh:mm a"
date-pattern = "dd-MM-yy"

[widgets.script.disk]
native-source = "disk"
format = "<label-prefix> <label>"
label = "%free%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "externaldrive.fill"
format-background = "pywal:13"
format-height = 28
format-radius = 14

[widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cpu"
format-background = "pywal:13"
format-height = 28
format-radius = 14

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%mb_used% MiB"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"
format-background = "pywal:13"
format-height = 28
format-radius = 14

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%downspeed%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%downspeed%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.updates]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "shippingbox.fill"
format-background = "pywal:13"
format-height = 28
format-radius = 14
native-action = "updates"
