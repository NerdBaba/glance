# Glance bar preset. Approved for Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 90
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#201f32"
foreground-color = "#f5edf0"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 40
top-margin = 10
margin = 18
horizontal-padding = 6
spacing = 3
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.terminal", "script.browser", "script.files", "script.editor", "script.photos", "script.recording", "script.music_app", "script.settings", "script.messages", "script.spaces", "spacer", "script.music", "script.playback_animation", "spacer", "script.updates", "script.weather", "script.volume", "script.memory", "script.clock"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.terminal]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "terminal"
native-action = "terminal"

[widgets.script.browser]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "folder.fill"
native-action = "files"

[widgets.script.editor]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.and.pencil"
native-action = "open-app"
module-name = "Editor"
action-app = "/Applications/Visual Studio Code.app"

[widgets.script.photos]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "photo"
native-action = "open-app"
module-name = "Photos"
action-app = "/System/Applications/Photos.app"

[widgets.script.recording]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "video.fill"
native-action = "open-app"
module-name = "Recording App"
action-app = "/System/Applications/QuickTime Player.app"

[widgets.script.music_app]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "music.note"
native-action = "open-app"
module-name = "Music App"
action-app = "/System/Applications/Music.app"

[widgets.script.settings]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "gearshape.fill"
native-action = "settings"

[widgets.script.messages]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "paperplane.fill"
native-action = "open-app"
module-name = "Messages"
action-app = "/System/Applications/Messages.app"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "[%index%]≡ › ‹"
label-active-foreground = "pywal:9"
label-focused = "[%index%]≡ › ‹"
label-focused-foreground = "pywal:9"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
native-display-mode = "focused-only"

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-online = "<label-prefix> <label-song> <label-prev> <label-toggle> <label-next>"
format-offline = "<label-prefix> <label>"
label-song = "%title% | %artist%"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "music.note"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""

[widgets.script.playback_animation]
native-source = "visualizer"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
visualizer-count = 42
visualizer-width = 190
visualizer-height = 18
visualizer-color = "pywal:10"
visualizer-color-2 = "pywal:12"

[widgets.script.updates]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "shippingbox.fill"
format-background = "pywal:6"
format-height = 28
native-action = "updates"
format-shape = "arrow"
format-padding-left = 10
format-padding-right = 14
group-spacing = -14

[widgets.script.weather]
native-source = "weather"
format = "<label-prefix> <label>"
label = "%condition%, %temperature%°"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cloud.sun.fill"
format-background = "pywal:14"
format-height = 28
format-shape = "arrow"
format-padding-left = 10
format-padding-right = 14

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:10"
format-height = 28
format-shape = "arrow"
format-padding-left = 10
format-padding-right = 14

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%mb_used% MiB"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"
format-background = "pywal:12"
format-height = 28
format-shape = "arrow"
format-padding-left = 10
format-padding-right = 14

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "clock"
format-background = "pywal:13"
format-height = 28
format-radius = 12
time-pattern = "EEE dd HH:mm"
date-pattern = "dd-MM-yy"
