# Glance bar draft. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "HelveticaNeue"
bar-font-size = 12
bar-font-weight = 3
widget-font-name = "HelveticaNeue"
widget-font-size = 12
widget-font-weight = 3
widget-background-color = "#08090e"
foreground-color = "#a0a0b8"

[experimental]

[experimental.foreground]
formation = "full"
position = "left"
height = 50
top-margin = 0
margin = 0
horizontal-padding = 14
spacing = 2
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.launcher", "script.layout", "script.files", "script.editor", "script.terminal", "script.notes", "script.palette", "script.spaces", "spacer", "script.window_icon", "script.window", "spacer", "script.music_app", "script.games", "script.clock", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.launcher]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "glance.pacman"
format-height = 20
native-action = "launcher"
capsule-group = "navigation"
capsule-background = "pywal:8"
capsule-background-opacity = 0.24
capsule-width = 34
capsule-vertical-padding = 8
capsule-spacing = 0.5
capsule-radius = 17
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.layout]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "rectangle.split.2x2"
format-height = 20
native-action = "settings"
capsule-group = "navigation"
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "rectangle.and.pencil.and.ellipsis"
format-height = 20
native-action = "files"
capsule-group = "navigation"
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.editor]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "chevron.left.forwardslash.chevron.right"
format-height = 20
native-action = "open-app"
action-app = "/Applications/Visual Studio Code.app"
capsule-group = "navigation"
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

