[widgets.script.palette]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "glance.pacman"
format-background = "pywal:15"
format-height = 28
format-radius = 14
native-action = "shuffle-colors"
format-min-width = 28
capsule-group = "navigation"
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
label-active = "●"
label-active-foreground = "pywal:15"
label-focused = "●"
label-focused-foreground = "pywal:15"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
native-orientation = "vertical"
workspace-indicator = "dot"
workspace-dot-size = 6
workspace-dot-spacing = 6
workspace-hit-height = 24
workspace-inactive-opacity = 0.18
label-empty-foreground = "pywal:15"
label-occupied-foreground = "pywal:15"
native-decoration = true
capsule-group = "navigation"
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.window_icon]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "display"
format-height = 20
native-action = "settings"
format-offset-y = 6
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.window]
native-source = "window"
format = "<label>"
label = "%name%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "Menlo-Regular:size=12"
format-height = 77
native-text-direction = "down"
label-maxlen = 13
format-font-name = "Menlo-Regular"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.music_app]
native-source = "text"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "FontAwesome6Brands-Regular:size=14"
format-height = 20
native-action = "open-app"
action-app = "/System/Applications/Music.app"
capsule-group = "lower"
capsule-width = 34
capsule-vertical-padding = 0
capsule-spacing = 8
capsule-radius = 0
format-font-name = "FontAwesome6Brands-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.games]
native-source = "text"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "FontAwesome6Brands-Regular:size=14"
format-height = 20
native-action = "open-app"
action-app = "/Applications/Steam.app"
capsule-group = "lower"
format-font-name = "FontAwesome6Brands-Regular"
format-font-size = 14
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%date%\n─\n%time%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue:size=12"
format-background = "pywal:8"
format-height = 116
format-radius = 17
time-pattern = "hh\nmm\na"
date-pattern = "EEE\nd"
native-line-limit = 6
format-min-width = 34
date-layout = "rail"
rail-clock-spacing = 3
format-background-opacity = 0.24
native-decoration = true
format-offset-y = 4
capsule-group = "lower"
format-font-name = "HelveticaNeue"
format-font-size = 12
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:9"
font-0 = "HelveticaNeue:size=12"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 20
native-action = "power"
capsule-group = "lower"
format-font-name = "HelveticaNeue"
