# Glance bar draft. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "Menlo-Bold"
bar-font-size = 11
bar-font-weight = 3
widget-font-name = "Menlo-Bold"
widget-font-size = 11
widget-font-weight = 3
widget-background-color = "#000000"
foreground-color = "#b6b6b6"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 34
top-margin = 0
margin = 0
horizontal-padding = 8
spacing = 4
scale-content = false
center-group-offset = -8

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.spaces", "script.playback_animation", "spacer", "script.clock", "script.elapsed", "script.weather", "spacer", "script.messages", "script.keyboard", "script.network", "script.volume", "script.battery"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "Menlo-Bold:size=11"
label-active = "●"
label-active-foreground = "pywal:15"
label-focused = "●"
label-focused-foreground = "pywal:15"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
workspace-indicator = "pill"
workspace-dot-size = 14
workspace-active-width = 30
workspace-dot-spacing = 7
workspace-hit-width = 14
label-empty-foreground = "pywal:8"
label-occupied-foreground = "pywal:8"
native-decoration = true
group-spacing = 24
workspace-inactive-opacity = 0.38
workspace-color-1 = "pywal:7"
format-padding-left = 4
format-font-name = "Menlo-Bold"
format-font-size = 11
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.playback_animation]
native-source = "visualizer"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "Menlo-Bold:size=11"
visualizer-count = 9
visualizer-width = 62
visualizer-height = 10
visualizer-bar-width = 3
visualizer-baseline = "center"
visualizer-color = "pywal:8"
visualizer-color-2 = "pywal:7"
format-font-name = "Menlo-Bold"
format-font-size = 11
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%\n%date%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "Menlo-Bold:size=11"
format-height = 24
time-pattern = "HH:mm:ss"
date-pattern = "EEEE, MMMM dd"
seconds = true
native-line-limit = 2
native-text-alignment = "left"
format-font-weight = 6
format-font-name = "Menlo-Bold"
format-font-size = 11
font-min-size = 6
native-icon-size = 14
date-layout = "stacked"
date-font = "HelveticaNeue-Bold:size=8"
date-stack-spacing = 0

[widgets.script.elapsed]
native-source = "music"
format = "<label-prefix> <label>"
label = "%elapsed%"
format-padding = "0px"
format-foreground = "pywal:7"
font-0 = "Menlo-Bold:size=11"
label-prefix = ""
native-symbol-label-prefix = "circle.fill"
format-online = "<label-prefix> <label>"
format-offline = "<label-prefix> <label>"
native-icon-size = 6
format-font-name = "Menlo-Bold"
format-font-size = 11
font-min-size = 6
format-font-weight = 3

[widgets.script.weather]
native-source = "weather"
format = "<label-prefix> <label>"
label = "%temperature%°C"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "Menlo-Bold:size=11"
label-prefix = ""
native-symbol-label-prefix = "cloud.fill"
format-font-name = "Menlo-Bold"
format-font-size = 11
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.messages]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "5px"
format-foreground = "pywal:15"
font-0 = "Menlo-Bold:size=11"
label-prefix = ""
native-symbol-label-prefix = "paperplane.fill"
native-action = "open-app"
action-app = "/System/Applications/Messages.app"
format-font-name = "Menlo-Bold"
format-font-size = 11
font-min-size = 6
native-icon-size = 14
format-font-weight = 3

[widgets.script.keyboard]
native-source = "keyboard"
format = "<label-prefix> <label>"
label = "%layout%"
format-padding = "4px"
format-foreground = "pywal:15"
font-0 = "HelveticaNeue-Medium:size=10"
label-prefix = ""
native-symbol-label-prefix = "keyboard"
format-background = "pywal:8"
format-height = 22
format-radius = 5
format-font-name = "HelveticaNeue-Medium"
format-font-size = 10
font-min-size = 6
native-icon-size = 10
format-font-weight = 3

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue-Medium:size=10"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-background = "pywal:15"
format-height = 22
format-radius = 5
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"
label-connected-maxlen = 8
format-font-name = "HelveticaNeue-Medium"
format-font-size = 10
font-min-size = 6
native-icon-size = 10
format-font-weight = 3

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue-Medium:size=10"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:15"
format-height = 22
format-radius = 5
format-font-name = "HelveticaNeue-Medium"
format-font-size = 10
font-min-size = 6
native-icon-size = 10
format-font-weight = 3

[widgets.script.battery]
native-source = "battery"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue-Medium:size=10"
label-prefix = ""
native-symbol-label-prefix = "battery.100"
format-background = "pywal:15"
format-height = 22
format-radius = 5
format-font-name = "HelveticaNeue-Medium"
format-font-size = 10
font-min-size = 6
native-icon-size = 10
format-font-weight = 3
