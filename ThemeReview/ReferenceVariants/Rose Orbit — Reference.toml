# Glance bar variant. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 90
border-width = 0
fill-opacity = 0
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#091521"
foreground-color = "#d5d3e8"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 30
top-margin = 2
margin = 15
horizontal-padding = 0
spacing = 6
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.clock", "script.network", "script.bluetooth", "spacer", "script.spaces", "spacer", "script.volume", "script.cpu", "script.memory", "script.ssid", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:0"
format-height = 26
format-radius = 12
time-pattern = "HH:mm"
date-pattern = "dd-MM-yy"
format-font-weight = 3

[widgets.script.network]
native-source = "network"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix>"
label-connected = ""
format-disconnected = "<label-prefix>"
label-disconnected = "Offline"
format-font-weight = 3
capsule-group = "connections"
capsule-background = "pywal:0"
capsule-height = 26
capsule-radius = 13
capsule-padding = 1
capsule-spacing = 0

[widgets.script.bluetooth]
native-source = "bluetooth"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-height = 26
label-prefix = ""
native-action = "bluetooth"
format-font-weight = 3
capsule-group = "connections"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=18"
format-background = "pywal:0"
format-height = 26
format-radius = 12
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "●"
label-empty = "●"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
workspace-color-1 = "pywal:15"
workspace-color-2 = "pywal:10"
workspace-color-3 = "pywal:9"
workspace-color-4 = "pywal:13"
workspace-color-5 = "pywal:12"
workspace-color-6 = "pywal:4"
workspace-color-7 = "pywal:8"
workspace-color-8 = "pywal:11"
workspace-color-9 = "pywal:6"
workspace-color-10 = "pywal:14"
format-font-weight = 3
workspace-indicator = "dot"
workspace-dot-size = 14
workspace-active-width = 14
workspace-dot-spacing = 7
format-padding-left = 5
format-padding-right = 5
format-min-width = 236

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%% ●"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:0"
format-height = 26
format-radius = 12
format-font-weight = 3

[widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cpu"
format-height = 26
format-font-weight = 3
capsule-group = "system"
capsule-background = "pywal:0"
capsule-height = 26
capsule-radius = 13
capsule-padding = 3
capsule-spacing = 0

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"
format-height = 26
format-font-weight = 3
capsule-group = "system"

[widgets.script.ssid]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"
format-font-weight = 3
capsule-group = "system"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 26
native-action = "power"
format-font-weight = 3
capsule-group = "system"
