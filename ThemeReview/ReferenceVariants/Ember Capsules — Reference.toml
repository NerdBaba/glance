# Glance bar variant. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 14
border-width = 0
fill-opacity = 0
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#262626"
foreground-color = "#dfd6b9"

[experimental]

[experimental.foreground]
formation = "full"
position = "top"
height = 34
top-margin = 11
margin = 18
horizontal-padding = 0
spacing = 6
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.spaces", "spacer", "script.term", "script.term_divider", "script.window", "spacer", "script.clock", "script.clock_divider", "script.calendar", "script.files_status", "script.notifications", "script.right_divider", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "5px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "rectangle.bottomthird.inset.filled"
format-height = 34
native-action = "launcher"
format-font-weight = 3
format-background = "pywal:0"
format-radius = 7
format-min-width = 38

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=18"
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "●"
label-empty = "●"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
format-font-weight = 3
format-background = "pywal:0"
format-height = 34
format-radius = 7
format-min-width = 118
workspace-indicator = "pill"
workspace-dot-size = 10
workspace-active-width = 20
workspace-dot-spacing = 0
format-padding-left = 6
format-padding-right = 6

[widgets.script.term]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "7px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "terminal"
native-action = "terminal"
format-font-weight = 3
capsule-group = "shell"
capsule-background = "pywal:0"
capsule-height = 34
capsule-radius = 7
capsule-padding = 5
capsule-spacing = 3

[widgets.script.web]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"
format-font-weight = 3

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "folder.fill"
native-action = "files"
format-font-weight = 3

[widgets.script.window]
native-source = "window"
format = "<label>"
label = "~"
format-padding = "7px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-height = 26
format-font-weight = 3
capsule-group = "shell"

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
time-pattern = "hh : mm a"
date-pattern = "dd-MM-yy"
format-font-weight = 5
capsule-group = "utilities"
capsule-background = "pywal:0"
capsule-height = 34
capsule-radius = 7
capsule-padding = 4
capsule-spacing = 3

[widgets.script.calendar]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "3px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "calendar"
native-action = "open-app"
action-app = "/System/Applications/Calendar.app"
format-font-weight = 3
capsule-group = "utilities"

[widgets.script.notifications]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "3px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "bell.fill"
native-action = "notifications"
format-font-weight = 3
capsule-group = "utilities"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "3px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 26
native-action = "power"
format-font-weight = 3
capsule-group = "utilities"

[widgets.script.term_divider]
native-source = "text"
format = "<label>"
label = "┆"
format-foreground = "pywal:15"
format-padding = "0px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
capsule-group = "shell"

[widgets.script.files_status]
native-source = "text"
format = "<label-prefix>"
label = ""
format-foreground = "pywal:15"
format-padding = "2px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-symbol-label-prefix = "folder.fill"
label-prefix = ""
native-action = "files"
capsule-group = "utilities"

[widgets.script.right_divider]
native-source = "text"
format = "<label>"
label = "┆"
format-foreground = "pywal:15"
format-padding = "3px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
capsule-group = "utilities"

[widgets.script.clock_divider]
native-source = "text"
format = "<label>"
label = "│"
format-foreground = "pywal:15"
format-padding = "1px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
capsule-group = "utilities"
