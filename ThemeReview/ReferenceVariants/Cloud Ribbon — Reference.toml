# Glance bar variant. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 72
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#f5f6fa"
foreground-color = "#44536a"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 50
top-margin = 0
margin = 160
horizontal-padding = 18
spacing = 6
scale-content = false
center-group-offset = -64

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.spaces", "script.menu", "script.term", "script.files", "script.web", "spacer", "script.clock", "spacer", "script.volume", "script.disk", "script.cpu", "script.memory", "script.network", "script.updates"]

[widgets.pywal]
foreground-index = 0
background-index = 15
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"
format-font-weight = 3

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=18"
format-background = "pywal:13"
format-height = 28
format-radius = 14
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "●"
label-empty = "●"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
format-font-weight = 3
workspace-indicator = "ring-active"
workspace-dot-size = 13
workspace-active-width = 13
workspace-dot-spacing = 4
format-padding-left = 7
format-padding-right = 7
workspace-color-1 = "pywal:10"
workspace-color-2 = "pywal:0"
workspace-color-3 = "pywal:5"
workspace-color-4 = "pywal:0"
workspace-color-5 = "pywal:0"
workspace-color-6 = "pywal:0"

[widgets.script.term]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "terminal"
native-action = "terminal"
format-font-weight = 3

[widgets.script.web]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"
format-font-weight = 3

[widgets.script.files]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "folder.fill"
native-action = "files"
format-font-weight = 3

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <bar-volume>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26
bar-volume-width = 8
bar-volume-fill = "▰"
bar-volume-empty = "▰"
bar-volume-indicator = ""
bar-volume-foreground-0 = "pywal:10"
bar-volume-foreground-1 = "pywal:10"
format-font-weight = 3
bar-volume-fill-foreground = "pywal:10"
bar-volume-empty-foreground = "pywal:0"
format-tracking = 0
font-1 = "Menlo:size=14"
bar-volume-fill-font = 1
bar-volume-empty-font = 1

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "12px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:13"
format-height = 28
format-radius = 14
time-pattern = "hh:mm a"
date-pattern = "dd-MM-yy"
format-font-weight = 3

[widgets.script.disk]
native-source = "disk"
format = "<label-prefix> <label>"
label = "%used-gb%"
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "externaldrive.fill"
format-height = 28
format-font-weight = 3
capsule-group = "metrics"
capsule-background = "pywal:13"
capsule-height = 28
capsule-radius = 14
capsule-padding = 4
capsule-spacing = 0
label-prefix-foreground = "pywal:9"

[widgets.script.cpu]
native-source = "cpu"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cpu"
format-height = 28
format-font-weight = 3
capsule-group = "metrics"
label-prefix-foreground = "pywal:10"

[widgets.script.memory]
native-source = "memory"
format = "<label-prefix> <label>"
label = "%mb_used% MiB"
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "memorychip.fill"
format-height = 28
format-font-weight = 3
capsule-group = "metrics"
label-prefix-foreground = "pywal:11"

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%downspeed-compact%"
format-padding = "6px"
format-foreground = "pywal:10"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%downspeed-compact%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"
format-font-weight = 3
label-connected-foreground = "pywal:0"

[widgets.script.updates]
native-source = "updates"
format = "<label-prefix> <label>"
label = "%count%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "arrow.triangle.2.circlepath"
format-background = "pywal:13"
format-height = 28
format-radius = 14
native-action = "updates"
format-font-weight = 3
module-name = "Glance updates"
label-prefix-foreground = "pywal:14"

[widgets.script.menu]
native-source = "text"
format = "<label>"
label = "⋮"
format-foreground = "pywal:0"
format-padding = "0px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-action = "settings"
