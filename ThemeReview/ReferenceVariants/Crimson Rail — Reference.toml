# Glance bar variant. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 8
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#2a292e"
foreground-color = "#b06c6b"

[experimental]

[experimental.foreground]
formation = "floating"
position = "left"
height = 36
top-margin = 12
margin = 12
horizontal-padding = 7
spacing = 0
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.clock", "spacer", "script.ornament", "spacer", "script.footer"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "0px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
time-pattern = "HH\nmm"
date-pattern = "dd-MM-yy"
native-line-limit = 2
format-height = 44
format-font-weight = 3

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "○"
label-empty = "○"
label-active-padding = 0
label-focused-padding = 1
label-occupied-padding = 0
label-empty-padding = 0
native-orientation = "vertical"
format-font-weight = 3

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"
format-font-weight = 3

[widgets.script.music_app]
native-source = "text"
format = "<label-prefix> <label>"
label = "│"
format-padding = "0px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "flame.fill"
native-action = "open-app"
action-app = "/System/Applications/Music.app"
format-font-weight = 3
format-height = 24

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26
format-font-weight = 3

[widgets.script.ornament]
native-source = "text"
format = "<label>"
label = "·\n†\n·"
format-foreground = "pywal:9"
format-padding = "0px"
format-height = 76
font-0 = "IosevkaNerdFontComplete-:size=18"
format-font-weight = 3
native-action = "launcher"
native-line-limit = 3
module-name = "Center ornament"

[widgets.script.footer]
native-source = "text"
format = "<label>"
label = ""
format-foreground = "pywal:0"
format-padding = "0px"
format-height = 50
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-decoration = true

[widgets.script.balance]
native-source = "text"
format = "<label>"
label = ""
format-foreground = "pywal:0"
format-padding = "0px"
format-height = 64
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-decoration = true
