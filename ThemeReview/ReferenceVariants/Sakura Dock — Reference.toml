# Glance bar variant. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "HelveticaNeue"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "HelveticaNeue"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#eedfe2"
foreground-color = "#814b65"

[experimental]

[experimental.foreground]
formation = "full"
position = "bottom"
height = 38
top-margin = 0
margin = 0
horizontal-padding = 10
spacing = 7
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.clock", "script.weather", "spacer", "script.spaces", "spacer", "script.collapse", "script.keyboard", "script.expand", "script.network", "script.appearance", "script.volume", "script.power"]

[widgets.pywal]
foreground-index = 0
background-index = 15
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "user"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
label-prefix = ""
native-symbol-label-prefix = "person.crop.circle.fill"
format-height = 28
native-action = "launcher"
format-font-weight = 3
user-avatar-size = 24
module-name = "User launcher"
native-icon-size = 23

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
format-background = "pywal:9"
format-height = 26
format-radius = 6
time-pattern = "h:mm a"
date-pattern = "dd-MM-yy"
format-font-weight = 6

[widgets.script.weather]
native-source = "weather"
format = "<label-prefix> <label>"
label = "%temperature%°"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
label-prefix = ""
native-symbol-label-prefix = "cloud.fill"
format-background = "pywal:9"
format-height = 26
format-radius = 6
format-font-weight = 3

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
format-background = "pywal:9"
format-height = 26
format-radius = 10
label-active = "●"
label-active-foreground = "pywal:0"
label-focused = "●"
label-focused-foreground = "pywal:0"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
label-occupied-foreground = "pywal:6"
label-empty-foreground = "pywal:6"
format-font-weight = 3
workspace-indicator = "pill"
workspace-dot-size = 10
workspace-active-width = 30
workspace-dot-spacing = 0
format-padding-left = 6
format-padding-right = 6
format-min-width = 97

[widgets.script.keyboard]
native-source = "keyboard"
format = "<label>"
label = "%layout-lower%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
format-background = "pywal:9"
format-height = 28
format-radius = 8
format-font-weight = 3

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix>"
label = ""
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 24
format-font-weight = 3
capsule-group = "status"

[widgets.script.network]
native-source = "network"
format = "<label-prefix>"
label = ""
format-padding = "4px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 24
format-connected = "<label-prefix>"
label-connected = ""
format-disconnected = "<label-prefix>"
label-disconnected = ""
format-font-weight = 3
capsule-group = "status"
capsule-background = "pywal:9"
capsule-height = 24
capsule-radius = 8
capsule-padding = 1
capsule-spacing = 0

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "HelveticaNeue:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-background = "pywal:9"
format-height = 26
format-radius = 14
native-action = "power"
format-font-weight = 3

[widgets.script.expand]
native-source = "text"
format = "<label-prefix>"
label = ""
format-foreground = "pywal:0"
format-padding = "6px"
format-height = 24
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-symbol-label-prefix = "chevron.left"
label-prefix = ""
format-background = "pywal:9"
format-radius = 8
native-action = "settings"

[widgets.script.appearance]
native-source = "text"
format = "<label-prefix>"
label = ""
format-foreground = "pywal:0"
format-padding = "3px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-symbol-label-prefix = "circle.lefthalf.filled"
label-prefix = ""
native-action = "style"
capsule-group = "status"

[widgets.script.collapse]
native-source = "text"
format = "<label-prefix>"
label = ""
format-foreground = "pywal:0"
format-padding = "3px"
format-height = 26
font-0 = "IosevkaNerdFontComplete-:size=14"
format-font-weight = 3
native-symbol-label-prefix = "chevron.up"
label-prefix = ""
native-action = "settings"
