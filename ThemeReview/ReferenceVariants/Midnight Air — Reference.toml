# Glance bar variant. Review before saving to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 0
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 3
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 3
widget-background-color = "#1a2b33"
foreground-color = "#b7aec1"

[experimental]

[experimental.foreground]
formation = "full"
position = "bottom"
height = 28
top-margin = 0
margin = 0
horizontal-padding = 12
spacing = 6
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.music", "script.volume", "spacer", "script.spaces", "spacer", "script.network", "script.clock"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-online = "<label-prefix> <label-song>  <label-prev> <label-toggle> <label-next>"
format-offline = "<label-prefix> <label>"
label-song = "%artist% - %title%"
label-song-maxlen = 36
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "music.note"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""
format-font-weight = 2

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26
format-font-weight = 2

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "%index%"
label-active-foreground = "pywal:9"
label-focused = "%index%"
label-focused-foreground = "pywal:9"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
format-font-weight = 2

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"
format-font-weight = 2

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "calendar"
time-pattern = "EEE hh:mm a"
date-pattern = "dd-MM-yy"
format-font-weight = 2
