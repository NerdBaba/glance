# Glance reference bar draft. Awaiting approval before adding to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#1b1b27"
foreground-color = "#acafce"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 38
top-margin = 5
margin = 26
horizontal-padding = 6
spacing = 8
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.weather", "spacer", "script.spaces", "spacer", "script.network", "script.volume", "script.brightness", "script.clock"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.weather]
native-source = "weather"
format = "<label-prefix> <label>"
label = "%temperature%°C"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cloud.fill"
format-background = "pywal:8"
format-height = 28
label-prefix-background = "pywal:13"
label-prefix-foreground = "pywal:0"
label-prefix-padding = 1
label-padding = 1
label-connected-padding = 1

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-background = "pywal:8"
format-height = 26
native-action = "launcher"

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=18"
label-active = "●"
label-active-foreground = "pywal:9"
label-focused = "●"
label-focused-foreground = "pywal:9"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1

[widgets.script.network]
native-source = "network"
format = "<label-prefix> <label>"
label = "%essid%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-background = "pywal:8"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = "%essid%"
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"
label-prefix-background = "pywal:12"
label-prefix-foreground = "pywal:0"
label-prefix-padding = 1
label-padding = 1
label-connected-padding = 1

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:8"
format-height = 26
label-prefix-background = "pywal:10"
label-prefix-foreground = "pywal:0"
label-prefix-padding = 1
label-padding = 1
label-connected-padding = 1

[widgets.script.brightness]
native-source = "brightness"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "sun.max.fill"
format-background = "pywal:8"
format-height = 26
label-prefix-background = "pywal:6"
label-prefix-foreground = "pywal:0"
label-prefix-padding = 1
label-padding = 1
label-connected-padding = 1

[widgets.script.clock]
native-source = "date"
format = "<label-prefix> <label>"
label = "%time%"
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "clock"
format-background = "pywal:8"
format-height = 28
time-pattern = "hh:mm a"
date-pattern = "dd-MM-yy"
label-prefix-background = "pywal:11"
label-prefix-foreground = "pywal:0"
label-prefix-padding = 1
label-padding = 1
label-connected-padding = 1
