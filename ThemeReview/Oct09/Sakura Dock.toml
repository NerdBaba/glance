# Glance reference bar draft. Awaiting approval before adding to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 20
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#eedfe2"
foreground-color = "#814b65"

[experimental]

[experimental.foreground]
formation = "full"
position = "bottom"
height = 40
top-margin = 0
margin = 0
horizontal-padding = 6
spacing = 7
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.clock", "script.weather", "spacer", "script.spaces", "spacer", "script.keyboard", "script.volume", "script.network", "script.power"]

[widgets.pywal]
foreground-index = 0
background-index = 15
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:9"
format-height = 28
format-radius = 6
time-pattern = "hh:mm a"
date-pattern = "dd-MM-yy"

[widgets.script.weather]
native-source = "weather"
format = "<label-prefix> <label>"
label = "%temperature%°"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "cloud.fill"
format-background = "pywal:9"
format-height = 28
format-radius = 6

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=18"
format-background = "pywal:9"
format-height = 28
format-radius = 10
label-active = "●"
label-active-foreground = "pywal:0"
label-focused = "●"
label-focused-foreground = "pywal:0"
label-occupied = "○"
label-empty = "○"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
label-occupied-foreground = "pywal:0"
label-empty-foreground = "pywal:0"

[widgets.script.keyboard]
native-source = "keyboard"
format = "<label>"
label = "%layout%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:9"
format-height = 28
format-radius = 8

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-background = "pywal:9"
format-height = 26
format-radius = 8

[widgets.script.network]
native-source = "network"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-background = "pywal:9"
format-height = 26
format-radius = 8
format-connected = "<label-prefix> <label-connected>"
label-connected = ""
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:0"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-background = "pywal:9"
format-height = 26
format-radius = 14
native-action = "power"
