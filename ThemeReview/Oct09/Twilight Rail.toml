# Glance reference bar draft. Awaiting approval before adding to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 0
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#292323"
foreground-color = "#e5dfdf"

[experimental]

[experimental.foreground]
formation = "full"
position = "left"
height = 32
top-margin = 0
margin = 0
horizontal-padding = 8
spacing = 9
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.apps", "script.spaces", "spacer", "script.music_app", "script.palette", "script.network", "script.volume", "script.bluetooth", "script.clock"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-background = "pywal:8"
format-radius = 12
label-active = "▮"
label-active-foreground = "pywal:15"
label-focused = "▮"
label-focused-foreground = "pywal:15"
label-occupied = "●"
label-empty = "●"
label-active-padding = 0
label-focused-padding = 1
label-occupied-padding = 0
label-empty-padding = 0
native-orientation = "vertical"
label-empty-foreground = "pywal:8"
label-occupied-foreground = "pywal:8"

[widgets.script.apps]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "square.grid.2x2.fill"
format-height = 26
native-action = "launcher"

[widgets.script.music_app]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "music.note"
native-action = "open-app"
action-app = "/System/Applications/Music.app"

[widgets.script.palette]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "paintpalette.fill"
format-height = 26
native-action = "shuffle-colors"

[widgets.script.network]
native-source = "network"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = ""
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26

[widgets.script.bluetooth]
native-source = "bluetooth"
format = "<label-prefix> <label>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-height = 26
label-prefix = ""
native-action = "bluetooth"

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=18"
time-pattern = "HH\nmm"
date-pattern = "dd-MM-yy"
native-line-limit = 2
format-height = 46
