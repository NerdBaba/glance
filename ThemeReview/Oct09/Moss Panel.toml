# Glance reference bar draft. Awaiting approval before adding to Randomazzo.
theme = "system"
preset = "flat-dark"
style = "solid"
use-pywal = true

[appearance]
roundness = 10
border-width = 0
fill-opacity = 1
shadow-opacity = 0
shadow-radius = 0
bar-font-name = "IosevkaNerdFontComplete-"
bar-font-size = 14
bar-font-weight = 4
widget-font-name = "IosevkaNerdFontComplete-"
widget-font-size = 14
widget-font-weight = 4
widget-background-color = "#24292c"
foreground-color = "#a4b3ac"

[experimental]

[experimental.foreground]
formation = "floating"
position = "top"
height = 32
top-margin = 4
margin = 6
horizontal-padding = 6
spacing = 3
scale-content = false

[experimental.foreground.widgets-background]
displayed = true

[experimental.background]
displayed = false

[widgets]
displayed = ["script.clock", "script.calendar", "script.music", "spacer", "script.spaces", "spacer", "script.browser", "script.music_app", "script.clipboard", "script.volume", "script.brightness", "script.network", "script.power"]

[widgets.pywal]
foreground-index = 15
background-index = 0
accent-index = 10

[widgets.widget-colors]
mode = "disabled"

[widgets.script]

[widgets.script.clock]
native-source = "date"
format = "<label>"
label = "%time%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
time-pattern = "HH:mm EEE, MMM dd"
date-pattern = "dd-MM-yy"

[widgets.script.calendar]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "calendar"
native-action = "open-app"
action-app = "/System/Applications/Calendar.app"

[widgets.script.music]
native-source = "music"
format = "<label>"
label = "No music"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
format-online = "<label-prefix> <label-song>"
format-offline = "<label-prefix> <label>"
label-song = "%title%"
label-song-maxlen = 42
label-song-ellipsis = true
label-prefix = ""
native-symbol-label-prefix = "music.note"
icon-prev = "⏮"
icon-next = "⏭"
icon-pause = "Ⅱ"
icon-play = "▶"
native-symbol-icon-prev = "backward.end.fill"
native-symbol-icon-next = "forward.end.fill"
native-symbol-icon-play = "play.fill"
native-symbol-icon-pause = "pause.fill"
label-prev = "%{A1:previous:}⏮%{A}"
label-next = "%{A1:next:}⏭%{A}"
label-toggle = ""

[widgets.script.spaces]
native-source = "workspaces"
format = "<label>"
label = ""
format-padding = "0px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-active = "%index%"
label-active-foreground = "pywal:9"
label-focused = "%index%"
label-focused-foreground = "pywal:9"
label-occupied = "%index%"
label-empty = "%index%"
label-active-padding = 1
label-focused-padding = 1
label-occupied-padding = 1
label-empty-padding = 1
label-active-background = "pywal:8"
label-focused-background = "pywal:8"
label-occupied-background = "pywal:8"
label-empty-background = "pywal:8"

[widgets.script.browser]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "globe"
native-action = "browser"

[widgets.script.music_app]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "music.note"
native-action = "open-app"
action-app = "/System/Applications/Music.app"

[widgets.script.clipboard]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "doc.on.clipboard"
format-height = 26
native-action = "open-app"
action-app = "/System/Applications/Notes.app"

[widgets.script.volume]
native-source = "volume"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "speaker.wave.2.fill"
format-height = 26

[widgets.script.brightness]
native-source = "brightness"
format = "<label-prefix> <label>"
label = "%percentage%%"
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "sun.max.fill"
format-height = 26

[widgets.script.network]
native-source = "network"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:15"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "wifi"
format-height = 26
format-connected = "<label-prefix> <label-connected>"
label-connected = ""
format-disconnected = "<label-prefix> <label-disconnected>"
label-disconnected = "Offline"

[widgets.script.power]
native-source = "text"
format = "<label-prefix>"
label = ""
format-padding = "6px"
format-foreground = "pywal:9"
font-0 = "IosevkaNerdFontComplete-:size=14"
label-prefix = ""
native-symbol-label-prefix = "power"
format-height = 26
native-action = "power"
